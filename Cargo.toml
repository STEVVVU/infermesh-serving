[package]
name = "infermesh-serving"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Production-shaped AI inference serving control plane"
license = "MIT"

[lib]
name = "infermesh"
path = "src/lib.rs"

[[bin]]
name = "infermesh-server"
path = "src/main.rs"

[[bin]]
name = "infermesh-bench"
path = "src/bin/benchmark.rs"

[dependencies]
ctrlc = "3.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
