[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infermesh-worker"
version = "0.1.0"
description = "Python model worker adapters for InferMesh"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
onnx = ["numpy>=1.26", "onnxruntime>=1.17"]
torch = ["torch>=2.2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["infermesh_worker*"]
